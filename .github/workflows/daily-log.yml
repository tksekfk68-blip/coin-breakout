name: daily-log

# 매일 09:10(KST) 어제 마감 기준 신호 기록 + 지난 신호 채점
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * *'
  push:
    branches: [main]
    paths: ['scripts/daily-log.mjs']

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/daily-log.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research/picks.json public/research/track.json
          git diff --cached --quiet && exit 0
          git commit -m "daily-log: 신호 기록·채점 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
