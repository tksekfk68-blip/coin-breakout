name: analyze
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0,6,12,18 * * *'   # 09:15, 15:15, 21:15, 03:15 (KST)
  push:
    branches: [main]
    paths: ['scripts/analyze.mjs', 'public/research/watch.json']
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/analyze.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research/analyze.json
          git diff --cached --quiet && exit 0
          git commit -m "analyze: 보유 코인 분석 갱신 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
